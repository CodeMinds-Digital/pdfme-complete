<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFme - DocuSign Style Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/antd@5/dist/antd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css">
    <script src="../dist/index.umd.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
        }

        .demo-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .demo-header {
            background: linear-gradient(135deg, #0070E0 0%, #0056B3 100%);
            color: white;
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0, 112, 224, 0.2);
        }

        .demo-title {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .demo-subtitle {
            margin: 4px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .demo-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .workflow-tabs {
            background: white;
            border-right: 1px solid #dee2e6;
            width: 200px;
            padding: 16px;
        }

        .workflow-tab {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background: white;
            color: #495057;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .workflow-tab:hover {
            background: #f8f9fa;
            border-color: #0070E0;
        }

        .workflow-tab.active {
            background: #0070E0;
            color: white;
            border-color: #0070E0;
        }

        .workflow-tab-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .workflow-tab-desc {
            font-size: 12px;
            opacity: 0.8;
        }

        .main-content {
            flex: 1;
            background: white;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-prepare {
            background: #fff3cd;
            color: #856404;
        }

        .status-assign {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-sign {
            background: #d4edda;
            color: #155724;
        }

        .status-complete {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        const { Button, Space, Typography, Card, Steps, Progress, Badge, message } = antd;
        const { Title, Text } = Typography;
        const { Step } = Steps;

        // Import PDFme components
        const { Designer, Sender, Form, Viewer, generate, builtInPlugins } = PDFme;

        // Sample template for demo
        const sampleTemplate = {
            basePdf: PDFme.BLANK_PDF,
            schemas: [
                [
                    {
                        name: 'signature1',
                        type: 'signature',
                        position: { x: 50, y: 100 },
                        width: 150,
                        height: 50,
                        required: true,
                    },
                    {
                        name: 'name',
                        type: 'text',
                        position: { x: 50, y: 160 },
                        width: 120,
                        height: 20,
                        required: true,
                    },
                    {
                        name: 'email',
                        type: 'text',
                        position: { x: 50, y: 190 },
                        width: 120,
                        height: 20,
                        required: true,
                    },
                    {
                        name: 'date',
                        type: 'date',
                        position: { x: 50, y: 220 },
                        width: 80,
                        height: 20,
                        required: false,
                    },
                ]
            ]
        };

        // Sample signers
        const initialSigners = [
            {
                id: 'signer_1',
                name: 'John Doe',
                email: 'john.doe@example.com',
                role: 'signer',
                color: '#FFD700',
                order: 1,
                status: 'not_started',
            },
            {
                id: 'signer_2',
                name: 'Jane Smith',
                email: 'jane.smith@example.com',
                role: 'witness',
                color: '#FF6B6B',
                order: 2,
                status: 'not_started',
            }
        ];

        const DocuSignDemo = () => {
            const [currentWorkflow, setCurrentWorkflow] = useState('prepare');
            const [template, setTemplate] = useState(sampleTemplate);
            const [signers, setSigners] = useState(initialSigners);
            const [completedStages, setCompletedStages] = useState([]);

            const workflows = [
                {
                    key: 'prepare',
                    title: 'Prepare Document',
                    description: 'Upload PDF and place fields',
                    status: 'prepare',
                },
                {
                    key: 'assign',
                    title: 'Assign Fields',
                    description: 'Assign fields to signers',
                    status: 'assign',
                },
                {
                    key: 'sign',
                    title: 'Collect Signatures',
                    description: 'Send for signature',
                    status: 'sign',
                },
                {
                    key: 'complete',
                    title: 'Review & Complete',
                    description: 'Download signed document',
                    status: 'complete',
                }
            ];

            const handleSaveTemplate = useCallback((newTemplate) => {
                setTemplate(newTemplate);
                message.success('Template saved successfully');
            }, []);

            const handleSendForSignature = useCallback((newTemplate, signerList, emailMessage) => {
                setTemplate(newTemplate);
                setSigners(signerList);
                setCompletedStages(prev => [...prev, 'prepare', 'assign']);
                message.success('Document sent for signature');
                setCurrentWorkflow('sign');
            }, []);

            const handleStageChange = useCallback((stage) => {
                setCurrentWorkflow(stage);
            }, []);

            const handleSignersUpdate = useCallback((newSigners) => {
                setSigners(newSigners);
            }, []);

            const renderWorkflowContent = () => {
                switch (currentWorkflow) {
                    case 'prepare':
                        return (
                            <Designer
                                template={template}
                                onSaveTemplate={handleSaveTemplate}
                                plugins={builtInPlugins}
                                options={{
                                    theme: {
                                        token: {
                                            colorPrimary: '#0070E0',
                                        }
                                    }
                                }}
                            />
                        );

                    case 'assign':
                        return (
                            <Sender
                                template={template}
                                onSaveTemplate={handleSaveTemplate}
                                onSendForSignature={handleSendForSignature}
                                onStageChange={handleStageChange}
                                currentStage="assign"
                                signers={signers}
                                onSignersUpdate={handleSignersUpdate}
                            />
                        );

                    case 'sign':
                        return (
                            <Form
                                template={template}
                                inputs={[{}]}
                                onChangeInput={() => { }}
                                plugins={builtInPlugins}
                                options={{
                                    theme: {
                                        token: {
                                            colorPrimary: '#0070E0',
                                        }
                                    }
                                }}
                            />
                        );

                    case 'complete':
                        return (
                            <Viewer
                                template={template}
                                inputs={[{}]}
                                plugins={builtInPlugins}
                                options={{
                                    theme: {
                                        token: {
                                            colorPrimary: '#0070E0',
                                        }
                                    }
                                }}
                            />
                        );

                    default:
                        return <div>Select a workflow stage</div>;
                }
            };

            return (
                <div className="demo-container">
                    {/* Header */}
                    <div className="demo-header">
                        <h1 className="demo-title">PDFme - DocuSign Style Demo</h1>
                        <p className="demo-subtitle">
                            Complete document signing workflow with professional UI
                        </p>
                    </div>

                    {/* Content */}
                    <div className="demo-content">
                        {/* Workflow Navigation */}
                        <div className="workflow-tabs">
                            <Title level={5} style={{ marginBottom: 16, color: '#495057' }}>
                                Workflow Stages
                            </Title>

                            {workflows.map((workflow) => (
                                <button
                                    key={workflow.key}
                                    className={`workflow-tab ${currentWorkflow === workflow.key ? 'active' : ''}`}
                                    onClick={() => setCurrentWorkflow(workflow.key)}
                                >
                                    <div className="workflow-tab-title">
                                        {workflow.title}
                                        {completedStages.includes(workflow.key) && (
                                            <Badge
                                                count="✓"
                                                style={{
                                                    backgroundColor: '#00A651',
                                                    marginLeft: 8,
                                                    fontSize: 10,
                                                }}
                                            />
                                        )}
                                    </div>
                                    <div className="workflow-tab-desc">
                                        {workflow.description}
                                    </div>
                                </button>
                            ))}

                            {/* Progress Summary */}
                            <Card
                                size="small"
                                style={{ marginTop: 24 }}
                                title="Progress Summary"
                            >
                                <div style={{ marginBottom: 8 }}>
                                    <Text style={{ fontSize: 12 }}>Stages Completed</Text>
                                    <Progress
                                        percent={(completedStages.length / workflows.length) * 100}
                                        size="small"
                                        strokeColor="#0070E0"
                                    />
                                </div>

                                <div style={{ fontSize: 11, color: '#6c757d' }}>
                                    <div>• Template: {template.schemas[0].length} fields</div>
                                    <div>• Signers: {signers.length} recipients</div>
                                    <div>• Status: {currentWorkflow.charAt(0).toUpperCase() + currentWorkflow.slice(1)}</div>
                                </div>
                            </Card>
                        </div>

                        {/* Main Content Area */}
                        <div className="main-content">
                            {renderWorkflowContent()}
                        </div>
                    </div>
                </div>
            );
        };

        // Render the demo
        ReactDOM.render(<DocuSignDemo />, document.getElementById('root'));
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>

</html>
